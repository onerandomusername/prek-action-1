name: prek-action
description: Run pre-commit hooks using prek
inputs:
  extra_args:
    description: Options to pass to `prek run`
    required: false
    default: '--all-files'
  prek-version:
    description: Version of prek to install (e.g., '0.2.1', 'latest')
    required: false
    default: 'latest'
runs:
  using: composite
  steps:

  - name: Install uv
    uses: astral-sh/setup-uv@b75a909f75acd358c2196fb9a5f1299a9a8868a4 # v6.7.0
    with:
      enable-cache: true
  - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
    with:
      path: ~/.cache/prek
      key: prek-v1|${{ runner.os }}|${{ runner.arch }}|${{ hashFiles('**/.pre-commit-config.yaml') }}
  - run: |
      if [ "${{ inputs.prek-version }}" = "latest" ]; then
        uvx prek install-hooks
      else
        uvx prek==${{ inputs.prek-version }} install-hooks
      fi
    shell: bash
branding:
  icon: 'git-commit'
  color: 'orange'
